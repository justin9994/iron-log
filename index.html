<meta charset="utf-8">
<title>Iron Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Titillium+Web:wght@400;600&display=swap">
<style>
  /* Light-first, ASRV-direction system (v5.0): ink on chalk, hairlines, squared corners.
     Chakra Petch (caps) carries titles, labels, chips, buttons and numerals; Titillium Web carries
     lowercase running text (notes, explanations, inputs). Hierarchy comes from size and weight. */
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --surface2: #eeeeeb;
    --text: #121212;
    --text2: #6f6f6c;
    --text3: #9a9a96;
    --ink: #121212;          /* filled checks, chips, active segments */
    --ink-text: #ffffff;
    --accent: #c8431b;       /* exactly one primary action per screen */
    --accent-text: #ffffff;
    --red: #b3352b;
    --amber: #a8730a;
    --green: #25835a;
    --border: #dcdcd8;       /* hairlines, card edges */
    --border2: #c9c9c4;      /* controls */
    --radius: 6px;
    --font-display: 'Chakra Petch', 'Segoe UI', Arial, sans-serif;
    --font-body: 'Titillium Web', 'Segoe UI', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --surface: #1a1a19; --surface2: #242423;
      --text: #f2f2ef; --text2: #9a9a96; --text3: #6f6f6c;
      --ink: #f2f2ef; --ink-text: #121212;
      --accent: #e2582f; --accent-text: #ffffff;
      --red: #e06c6c; --amber: #d9a03c; --green: #3ec07f;
      --border: #2c2c2a; --border2: #3a3a37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --surface: #1a1a19; --surface2: #242423;
    --text: #f2f2ef; --text2: #9a9a96; --text3: #6f6f6c;
    --ink: #f2f2ef; --ink-text: #121212;
    --accent: #e2582f; --accent-text: #ffffff;
    --red: #e06c6c; --amber: #d9a03c; --green: #3ec07f;
    --border: #2c2c2a; --border2: #3a3a37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    overflow-x: hidden; background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    overscroll-behavior-y: none; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; min-height: 100dvh; }
  #main { flex: 1; padding: 20px 20px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; width: 100%; margin: 0 auto; }
  h1 {
    font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1;
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 14px; text-wrap: balance;
  }
  h2 {
    font-family: var(--font-display); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .14em; color: var(--text2); margin: 24px 0 10px;
  }
  h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .lbl {
    font-family: var(--font-display); font-size: 11px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text2); line-height: 1.2;
  }
  .lbl.ink { color: var(--text); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; align-self: flex-start; height: 20px; padding: 0 8px; border-radius: 2px;
    background: var(--ink); color: var(--ink-text); font-family: var(--font-display); font-size: 10px;
    font-weight: 700; letter-spacing: .12em; text-transform: uppercase; line-height: 1; white-space: nowrap;
  }
  .chip.lg { height: 28px; padding: 0 12px; font-size: 13px; letter-spacing: .14em; }
  .muted { color: var(--text2); font-size: 14px; }
  .small { font-size: 13px; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; }
  .chev { color: var(--text3); flex-shrink: 0; display: flex; }
  .chev svg { width: 16px; height: 16px; display: block; }
  /* names in cards and list rows are caps titles */
  .card b, .list-item b {
    font-family: var(--font-display); font-size: 15px; font-weight: 600; line-height: 1.25;
    text-transform: uppercase; letter-spacing: .06em; display: block;
  }

  /* ---- tab bar ---- */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: space-around;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 0 6px env(safe-area-inset-bottom);
  }
  #tabbar button {
    flex: 1; height: 64px; background: none; border: none; color: var(--text3);
    font-family: var(--font-display); font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .14em; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  #tabbar button svg { width: 22px; height: 22px; }
  #tabbar button.active { color: var(--text); }

  /* ---- cards / lists ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .card.tappable { cursor: pointer; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row .grow, .list-item .grow { flex: 1; min-width: 0; }
  .list-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 8px;
    border-radius: var(--radius); cursor: pointer;
  }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }

  /* ---- buttons: outlined ink by default; .primary is the one accent action on a screen ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 16px; background: transparent; color: var(--text);
    border: 1px solid var(--ink); border-radius: 4px;
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .14em; cursor: pointer; white-space: nowrap;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn.full { width: 100%; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.secondary { border-color: var(--border2); }
  .btn.danger { border-color: var(--border2); color: var(--red); }
  .btn.ghost { border-color: transparent; padding: 0 8px; }
  .btn.ghost.quiet { color: var(--text2); font-weight: 500; }
  .btn.sm { height: 34px; padding: 0 14px; }
  .iconbtn {
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text); cursor: pointer; font-family: inherit; font-size: 16px; flex-shrink: 0;
  }
  .iconbtn svg { width: 22px; height: 22px; }
  .seg { display: flex; border: 1px solid var(--border2); border-radius: 4px; padding: 3px; background: var(--surface); }
  .seg button {
    flex: 1; border: none; background: none; height: 34px; border-radius: 3px;
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em; color: var(--text2); cursor: pointer;
  }
  .seg button.active { background: var(--ink); color: var(--ink-text); }

  /* ---- forms ---- */
  input[type=text], textarea, select {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 11px 14px; font-size: 16px; font-family: var(--font-body);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); }
  label.field {
    display: block; margin-bottom: 14px; font-family: var(--font-display); font-size: 11px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text2);
  }
  label.field > input, label.field > textarea, label.field > select {
    display: block; margin-top: 8px; font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-weight: 400;
  }
  .checkline { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 15px; color: var(--text); cursor: pointer; }
  .checkline input { width: 20px; height: 20px; accent-color: var(--ink); }

  /* ---- home ---- */
  .home-top { display: flex; align-items: center; justify-content: space-between; height: 24px; margin-bottom: 20px; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: .22em; }
  .inprog {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 6px;
    border-radius: var(--radius); background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .inprog .lbl { color: var(--accent-text); opacity: .85; }
  .inprog .lbl.ink { opacity: 1; }
  .inprog .h2t { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .inprog svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---- workout list ---- */
  .wk-header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 8px 0 12px; margin: -8px 0 10px; display: flex; align-items: center; gap: 6px;
  }
  .wk-header .right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .elapsed { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .checkdot {
    width: 44px; height: 44px; border-radius: var(--radius); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); color: transparent; border: 1px solid var(--border2);
  }
  .checkdot svg { width: 20px; height: 20px; }
  .checkdot.complete { background: var(--ink); border-color: var(--ink); color: var(--ink-text); }

  /* exercise lists (live workout + template editor): hold-to-drag reorder, chain toggle between rows */
  .ex-list { margin-bottom: 4px; }
  .ex-item { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .ex-item .card { margin-bottom: 0; }
  .ex-list.reordering .ex-item:not(.drag) { transition: transform .15s ease; }
  .ex-item.drag { position: relative; z-index: 5; }
  .ex-item.drag .card { box-shadow: 0 10px 28px rgba(0,0,0,.22); border-color: var(--ink); }
  .ss-slot { height: 40px; display: flex; align-items: center; padding-left: 16px; }
  .ex-list.tpl .ss-slot { padding-left: 2px; }
  .ss-toggle {
    width: 44px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; color: var(--text3); cursor: pointer;
  }
  .ss-toggle svg { width: 22px; height: 22px; }
  .ss-toggle.active { color: var(--text); }
  .ex-list.tpl .card b { font-size: 13px; letter-spacing: .05em; }
  .ex-list.tpl .card { padding: 14px 10px 14px 14px; gap: 8px; }
  .ex-list.tpl .stepper button { width: 28px; height: 28px; font-size: 16px; }
  .ex-list.tpl .iconbtn { width: 34px; }
  .grip { color: var(--text2); opacity: .55; cursor: grab; flex-shrink: 0; touch-action: none; padding: 6px 2px; }
  .grip svg { width: 12px; height: 18px; display: block; }

  /* ---- template plan editor rows ---- */
  .set-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .set-row { display: flex; align-items: center; gap: 10px; }
  .set-row .num {
    width: 100%; height: 44px; text-align: center; padding: 0 8px;
    font-family: var(--font-display); font-size: 20px; font-weight: 700;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text);
  }
  .set-row .wcell, .set-row .rcell { flex: 1; }
  .set-row input.num::placeholder {
    font-family: var(--font-display); font-size: 9px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--text2);
  }
  .set-row .x { color: var(--text3); font-size: 14px; }
  .set-num {
    width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--border2); flex-shrink: 0;
    background: var(--surface); color: var(--text2); font-family: var(--font-display); font-weight: 700; font-size: 11px;
    letter-spacing: .06em; cursor: pointer;
  }
  .set-num.warmup { border-color: var(--ink); color: var(--text); }
  .set-row button.num { cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .repbtn .v { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .repbtn .unit, .xs-pill .unit {
    font-family: var(--font-display); font-size: 9px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text2); padding-top: 3px;
  }
  .repbtn.empty .unit, .xs-pill.empty .unit { padding-top: 0; }

  /* ---- rep editor sheet: drum + stepper + in-app keypad ---- */
  .re-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .re-head .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .re-top { display: flex; align-items: center; gap: 8px; margin: 6px 0 14px; }
  .re-step {
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); flex-shrink: 0;
    background: transparent; color: var(--text); font-size: 28px; font-weight: 400; line-height: 1;
    cursor: pointer; font-family: var(--font-display);
  }
  .re-drum {
    flex: 1; height: 136px; overflow: hidden; position: relative; touch-action: none;
    user-select: none; -webkit-user-select: none; cursor: ns-resize;
  }
  .re-col { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
  .re-col.snap { transition: transform .15s ease; }
  .re-ghost, .re-val { text-align: center; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .re-ghost { height: 34px; line-height: 34px; font-size: 24px; color: var(--text3); }
  .re-val { height: 68px; line-height: 68px; font-size: 64px; color: var(--text); }
  .re-drum.dragging .re-val { color: var(--accent); }
  .re-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .re-pad button {
    height: 52px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);
    font-family: var(--font-display); font-size: 24px; font-weight: 600; cursor: pointer;
  }
  .re-pad button:active { background: var(--surface2); }
  .re-pad button.blank { background: none; border-color: transparent; pointer-events: none; }

  /* ---- exercise screen ---- */
  .xs-top { display: flex; align-items: center; justify-content: space-between; margin: -6px 0 4px; }
  .xs-top .right { display: flex; align-items: center; gap: 12px; }
  .xs-ss { display: flex; align-items: center; gap: 6px; margin-top: 14px; color: var(--text); }
  .xs-ss svg { width: 16px; height: 16px; }
  .xs-title { margin: 8px 0 0; }
  .xs-sets { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .xs-row { display: flex; align-items: center; gap: 10px; }
  .xs-check {
    width: 44px; height: 44px; border-radius: var(--radius); border: 1px solid var(--border2); flex-shrink: 0; padding: 0;
    background: var(--surface); color: var(--text3); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .xs-check svg { width: 22px; height: 22px; }
  .xs-row.done .xs-check { background: var(--ink); border-color: var(--ink); color: var(--ink-text); }
  .xs-pill {
    width: 96px; height: 44px; border: 1px solid var(--border2); background: var(--surface); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; gap: 5px; flex-shrink: 0; padding: 0;
    font-family: var(--font-display); color: var(--text);
  }
  button.xs-pill { cursor: pointer; }
  .xs-pill .v, .xs-w input {
    font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .xs-w input { width: 2ch; min-width: 1ch; max-width: 64px; height: 100%; background: none; border: none; padding: 0; text-align: center; border-radius: 0; }
  .xs-w input:focus { outline: none; }
  .xs-w:focus-within { border-color: var(--ink); }
  .xs-row.done .xs-pill { opacity: .5; }
  .xs-more {
    width: 44px; height: 44px; margin-left: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text2); cursor: pointer;
  }
  .xs-more svg { width: 22px; height: 22px; }
  .xs-addrow { display: flex; align-items: center; margin-top: 6px; }
  .xs-last { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 16px; margin: 8px 0 0; }
  .xs-divider { border-top: 1px solid var(--border); margin: 22px -20px 18px; }
  .xs-notebox {
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .xs-notebox:focus-within { border-color: var(--ink); }
  .xs-note {
    display: block; width: 100%; background: none; border: none; padding: 0; border-radius: 0;
    font-size: 15px; line-height: 1.55; resize: none; min-height: 54px; overflow: hidden;
  }
  .xs-note:focus { outline: none; border: none; }
  .xs-note::placeholder { color: var(--text3); }
  .xs-notebox .meta { font-size: 9.5px; color: var(--text3); min-height: 12px; }

  /* superset advance: old screen slides out left, new one slides in from the right */
  .slide-ghost {
    position: fixed; inset: 0; z-index: 15; overflow: hidden; pointer-events: none;
    background: var(--bg);
    animation: ghost-out .28s cubic-bezier(.4, 0, .2, 1) forwards;
  }
  @keyframes ghost-out { to { transform: translateX(-100%); } }
  #main.slide-in { animation: main-in .28s cubic-bezier(.4, 0, .2, 1); }
  @keyframes main-in { from { transform: translateX(100%); } to { transform: none; } }
  .slide-ghost.back { animation-name: ghost-out-back; }
  @keyframes ghost-out-back { to { transform: translateX(100%); } }
  #main.slide-in-back { animation: main-in-back .28s cubic-bezier(.4, 0, .2, 1); }
  @keyframes main-in-back { from { transform: translateX(-100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .slide-ghost, #main.slide-in, #main.slide-in-back { animation: none; }
  }

  /* ---- rest timer bar + flash ---- */
  #timerbar {
    position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 19;
    background: var(--ink); color: var(--ink-text);
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums;
  }
  #timerbar button {
    background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 4px; height: 32px; padding: 0 12px;
    font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .14em; cursor: pointer;
  }
  @keyframes flashbg { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  #flash { position: fixed; inset: 0; background: var(--accent); z-index: 60; pointer-events: none; opacity: 0; display: none; }
  #flash.on { display: block; animation: flashbg .5s ease 3; }

  /* ---- bottom sheet ---- */
  #sheetwrap { position: fixed; inset: 0; z-index: 50; display: none; }
  #sheetwrap.open { display: block; }
  #sheetwrap .backdrop { position: absolute; inset: 0; background: rgba(18,18,18,.32); }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-radius: 12px 12px 0 0;
    padding: 18px 20px calc(22px + env(safe-area-inset-bottom));
    max-height: 80dvh; overflow-y: auto; max-width: 640px; margin: 0 auto;
    box-shadow: 0 -12px 40px rgba(0,0,0,.14);
  }
  #sheet h3 { margin-bottom: 14px; }
  #sheet p { font-size: 15px; }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(112px + env(safe-area-inset-bottom)); z-index: 70;
    background: var(--ink); color: var(--ink-text); padding: 10px 18px; border-radius: 4px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  /* ---- charts, stats, misc ---- */
  .chartbox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .chartbox svg { width: 100%; height: auto; display: block; }
  .chart-title {
    font-family: var(--font-display); font-size: 11px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text2); margin-bottom: 8px;
  }
  .banner {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; font-size: 14px;
  }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; height: 20px; padding: 0 6px;
    border: 1px solid var(--border2); border-radius: 2px; color: var(--text2);
    font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
  .stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-family: var(--font-display); font-size: 9.5px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {

    color: var(--text); font-size: 18px; font-weight: 600; cursor: pointer; font-family: var(--font-display);
  }
  .stepper .val { min-width: 26px; text-align: center; font-family: var(--font-display); font-weight: 700; }

</style>

<div id="app">
  <div id="main"></div>
  <div id="timerbar" style="display:none"></div>
  <nav id="tabbar"></nav>
  <div id="sheetwrap"><div class="backdrop" data-action="sheet-close"></div><div id="sheet"></div></div>
  <div id="toast"></div>
  <div id="flash"></div>
</div>

<script>
'use strict';

/* ===================== 1. UTILS ===================== */

function uid() {
  return (crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function pad2(n) { return String(n).padStart(2, '0'); }
function dateKeyOf(ms) {
  const d = new Date(ms);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function mondayKeyOf(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = (dt.getDay() + 6) % 7; // Mon=0
  dt.setDate(dt.getDate() - dow);
  return dateKeyOf(dt.getTime());
}
function monthKeyOf(dateKey) { return dateKey.slice(0, 7); }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateKey(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const now = new Date();
  return MONTHS[m - 1] + ' ' + d + (y !== now.getFullYear() ? ' ' + y : '');
}
function fmtDateTime(ms) {
  const d = new Date(ms);
  let h = d.getHours(), ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return fmtDateKey(dateKeyOf(ms)) + ', ' + h + ':' + pad2(d.getMinutes()) + ampm;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m >= 60) { const h = Math.floor(m / 60); return h + 'h ' + (m % 60) + 'm'; }
  return m + ':' + pad2(s);
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return '0';
  return (Math.round(n * 10) / 10).toLocaleString();
}
function parseNum(s) {
  const v = parseFloat(String(s).replace(',', '.'));
  return isNaN(v) || v < 0 ? null : v;
}

/* ===================== 2. STORAGE ===================== */

const storage = (() => {
  try {
    localStorage.setItem('wt.__test', '1');
    localStorage.removeItem('wt.__test');
    return localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      __memory: true
    };
  }
})();

function loadKey(key, fallback) {
  try {
    const raw = storage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveKey(key, val) {
  try {
    storage.setItem(key, JSON.stringify(val));
  } catch (e) {
    toast('Could not save — storage is full or blocked. Export a backup!');
  }
}

const SCHEMA_VERSION = 2;
const APP_VERSION = '5.0'; // bump on every deploy — shown in Settings so a stale phone cache is obvious

/* ===================== 3. STATE + STORE ===================== */

const DB = {
  meta: null, settings: null, exercises: [], routines: [], sessions: [], active: null
};

const UI = {
  view: 'home', params: {}, backStack: [],
  libTab: 'routines', histTab: 'workouts',
  progressExercise: null, progressGran: 'week',
  exSearch: '', pickerSearch: '',
  timerTotal: 0,          // seconds of current/last timer, for display
  importOpen: false
};

function saveMeta()      { saveKey('wt.meta', DB.meta); }
function saveSettings()  { saveKey('wt.settings', DB.settings); }
function saveExercises() { saveKey('wt.exercises', DB.exercises); }
function saveRoutines()  { saveKey('wt.routines', DB.routines); }
function saveSessions()  { saveKey('wt.sessions', DB.sessions); }
function saveActiveNow() { saveKey('wt.active', DB.active); }
const saveActive = debounce(saveActiveNow, 200);

// v1 routines had a flat `items` list; v2 nests them as templates (variations of one routine)
function migrateRoutinesV2(routines) {
  (routines || []).forEach(r => {
    if (!r.templates) {
      r.templates = [{ id: uid(), name: 'Main', items: r.items || [] }];
      delete r.items;
    }
  });
  return routines || [];
}

function migrate() {
  const meta = loadKey('wt.meta', null);
  if (!meta) return; // first run, seed() handles it
  let v = meta.schemaVersion || 1;
  if (v < 2) {
    saveKey('wt.routines', migrateRoutinesV2(loadKey('wt.routines', [])));
    v = 2;
  }
  if (v !== meta.schemaVersion) { meta.schemaVersion = v; saveKey('wt.meta', meta); }
}

const SEED_EXERCISES = [
  ['Squat', 'strength'], ['Bench Press', 'strength'], ['Deadlift', 'strength'],
  ['Overhead Press', 'strength'], ['Barbell Row', 'strength'], ['Pull-up', 'strength'],
  ['Lat Pulldown', 'strength'], ['Dumbbell Curl', 'strength'], ['Tricep Pushdown', 'strength'],
  ['Leg Press', 'strength'], ['Romanian Deadlift', 'strength'], ['Incline Dumbbell Press', 'strength']
];

function seed() {
  const now = Date.now();
  DB.exercises = SEED_EXERCISES.map(([name, type]) => ({
    id: uid(), name, type, restSec: null, notes: '', archived: false, createdAt: now
  }));
  const byName = n => DB.exercises.find(e => e.name === n).id;
  DB.routines = [
    { id: uid(), name: 'Upper', createdAt: now, updatedAt: now, templates: [{ id: uid(), name: 'Main', items: [
      { exerciseId: byName('Bench Press'), targetSets: 3 },
      { exerciseId: byName('Barbell Row'), targetSets: 3 },
      { exerciseId: byName('Overhead Press'), targetSets: 3 },
      { exerciseId: byName('Lat Pulldown'), targetSets: 3 },
      { exerciseId: byName('Dumbbell Curl'), targetSets: 3 },
      { exerciseId: byName('Tricep Pushdown'), targetSets: 3 }
    ]}]},
    { id: uid(), name: 'Lower', createdAt: now, updatedAt: now, templates: [{ id: uid(), name: 'Main', items: [
      { exerciseId: byName('Squat'), targetSets: 3 },
      { exerciseId: byName('Romanian Deadlift'), targetSets: 3 },
      { exerciseId: byName('Leg Press'), targetSets: 3 }
    ]}]}
  ];
  DB.meta = { schemaVersion: SCHEMA_VERSION, createdAt: now, seededAt: now };
  DB.settings = { unit: 'lbs', defaultRestSec: 90, timerMode: 'countdown', soundOn: true, vibrateOn: true, lastExportAt: null };
  DB.sessions = [];
  DB.active = null;
  saveMeta(); saveSettings(); saveExercises(); saveRoutines(); saveSessions(); saveActiveNow();
}

function loadAll() {
  migrate();
  DB.meta = loadKey('wt.meta', null);
  if (!DB.meta) { seed(); return; }
  DB.settings = Object.assign(
    { unit: 'lbs', defaultRestSec: 90, timerMode: 'countdown', soundOn: true, vibrateOn: true, lastExportAt: null },
    loadKey('wt.settings', {})
  );
  DB.exercises = loadKey('wt.exercises', []);
  DB.routines = loadKey('wt.routines', []);
  DB.sessions = loadKey('wt.sessions', []);
  DB.sessions.sort((a, b) => a.startedAt - b.startedAt);
  DB.active = loadKey('wt.active', null);
}

function exerciseById(id) { return DB.exercises.find(e => e.id === id) || null; }
function routineById(id)  { return DB.routines.find(r => r.id === id) || null; }
function exerciseInHistory(exerciseId) {
  return DB.sessions.some(s => s.entries.some(en => en.exerciseId === exerciseId));
}

/* ---- session lifecycle ---- */

function newSet(prev) {
  return {
    id: uid(),
    weight: prev ? prev.weight : null,
    unit: prev ? prev.unit : DB.settings.unit,
    reps: prev ? prev.reps : null,
    warmup: prev ? !!prev.warmup : false,
    note: '', done: false, completedAt: null
  };
}

// item: template item ({targetSets, plan?}) or null for mid-workout adds.
// Prefill priority: last finished session > template plan > empty rows.
function newEntry(exercise, item) {
  const entry = {
    id: uid(), exerciseId: exercise.id, exerciseName: exercise.name,
    type: 'strength', sets: [], note: ''
  };
  const last = lastByExercise().get(exercise.id);
  if (last) {
    entry.sets = last.entry.sets.filter(s => s.done).map(s => newSet(s));
    entry.note = last.entry.note || ''; // notes are persistent cues (form, RPE targets) — carry forward editable
    entry.noteAt = entry.note ? (last.entry.noteAt || null) : null; // when the cue was last edited (date shown under the note)
  }
  if (entry.sets.length === 0 && item && item.plan && item.plan.length) {
    entry.sets = item.plan.map(p => ({
      id: uid(), weight: p.weight, unit: p.unit || DB.settings.unit,
      reps: p.reps, warmup: !!p.warmup, note: '', done: false, completedAt: null
    }));
  }
  if (entry.sets.length === 0) {
    const n = Math.max(1, (item && item.targetSets) || 3);
    for (let i = 0; i < n; i++) entry.sets.push(newSet(null));
  }
  return entry;
}

function startSession(routine, template) {
  const now = Date.now();
  const entries = [];
  if (routine && template) {
    template.items.forEach(it => {
      const ex = exerciseById(it.exerciseId);
      if (ex && !ex.archived) {
        const entry = newEntry(ex, it);
        entry.ss = !!it.ss; // superset-linked with the NEXT entry
        entries.push(entry);
      }
    });
  }
  DB.active = {
    id: uid(),
    routineId: routine ? routine.id : null,
    routineName: routine ? routine.name : null,
    templateId: template ? template.id : null,
    templateName: template ? template.name : null,
    startedAt: now, finishedAt: null,
    dateKey: dateKeyOf(now),
    notes: '',
    entries,
    timer: { endsAt: null }
  };
  saveActiveNow();
  navigate('workout');
}

// Session display name: routine plus template variation when it's a named one
function sessionTitle(s) {
  let t = s.routineName || 'Workout';
  if (s.templateName && s.templateName !== 'Main') t += ' · ' + s.templateName;
  return t;
}

// Set when a finished workout's structure drifted from its template; consumed by the update sheet.
let pendingTplUpdate = null;

// Compares exercise sequence and superset links only — set counts are per-session
// (prefill sizes them from the last workout), so they never trigger the update prompt.
function itemsDiffer(a, b) {
  if (a.length !== b.length) return true;
  for (let i = 0; i < a.length; i++) {
    if (a[i].exerciseId !== b[i].exerciseId) return true;
    if (i < a.length - 1 && !!a[i].ss !== !!b[i].ss) return true; // ss on the last item is meaningless
  }
  return false;
}

function finishSession() {
  const s = DB.active;
  if (!s) return;
  const now = Date.now();
  // auto-complete filled but unchecked sets
  s.entries.forEach(en => en.sets.forEach(set => {
    if (!set.done && set.reps != null && set.reps > 0) { set.done = true; set.completedAt = now; }
  }));
  const entries = s.entries.map(en => {
    const sets = en.sets.filter(set => set.done);
    return sets.length ? Object.assign({}, en, { sets }) : null;
  }).filter(Boolean);

  if (!entries.length) {
    uiConfirm('Nothing was logged in this workout. Discard it?', () => {
      DB.active = null; saveActiveNow(); stopTimer(); navigate('home');
    });
    return;
  }
  // workout-as-structured (all entries kept in the workout, even skipped ones)
  const proposed = s.entries.map(en => ({
    exerciseId: en.exerciseId, targetSets: Math.max(1, en.sets.length), ss: !!en.ss
  }));
  const { t: tpl } = templateById(s.routineId, s.templateId);
  const tplName = sessionTitle(s);

  const done = Object.assign({}, s, { entries, finishedAt: now, timer: undefined });
  delete done.timer;
  DB.sessions.push(done);
  DB.sessions.sort((a, b) => a.startedAt - b.startedAt);
  saveSessions();
  DB.active = null; saveActiveNow();
  stopTimer();
  invalidateLastMap();
  toast('Workout saved 💪');
  navigate('home');

  if (tpl && itemsDiffer(tpl.items, proposed)) {
    pendingTplUpdate = { routineId: s.routineId, templateId: s.templateId, items: proposed };
    openSheet(
      '<h3>Update the template?</h3>' +
      '<p class="muted" style="margin-bottom:16px">This workout didn\'t match <b>' + esc(tplName) +
      '</b> — you changed the exercises, set counts, or supersets. Save those changes to the template for next time?</p>' +
      '<div class="row" style="gap:8px">' +
      '<button class="btn secondary" style="flex:1" data-action="sheet-close">Keep template</button>' +
      '<button class="btn primary" style="flex:1" data-action="tpl-update-yes">Save changes</button></div>',
      () => { pendingTplUpdate = null; }
    );
  }
}

function discardSession() {
  uiConfirm('Discard this workout? Logged sets will be lost.', () => {
    DB.active = null; saveActiveNow(); stopTimer(); navigate('home');
  });
}

/* ===================== 4. UNITS ===================== */

const LB_PER_KG = 2.20462;
function convertWeight(v, from, to) {
  if (v == null || from === to) return v;
  return from === 'kg' ? v * LB_PER_KG : v / LB_PER_KG;
}
function roundDisplay(v, unit) {
  if (v == null) return null;
  const step = unit === 'kg' ? 0.25 : 0.5;
  return Math.round(v / step) * step;
}
function displayWeight(set) {
  const u = DB.settings.unit;
  const v = roundDisplay(convertWeight(set.weight, set.unit || u, u), u);
  return v == null ? '' : String(v);
}
function weightInUnit(set, unit) {
  return convertWeight(set.weight, set.unit || unit, unit) || 0;
}

/* ===================== 5. DERIVED (prefill, stats, rollups) ===================== */

let _lastMap = null;
function invalidateLastMap() { _lastMap = null; }
function lastByExercise() {
  if (_lastMap) return _lastMap;
  const map = new Map();
  for (let i = DB.sessions.length - 1; i >= 0; i--) {
    const s = DB.sessions[i];
    for (const en of s.entries) {
      if (en.type !== 'strength') continue;
      if (!map.has(en.exerciseId) && en.sets.some(x => x.done)) {
        map.set(en.exerciseId, { session: s, entry: en });
      }
    }
  }
  _lastMap = map;
  return map;
}
function e1rm(set, unit) {
  if (!set.reps || set.reps <= 0) return 0;
  const w = weightInUnit(set, unit);
  if (!w) return 0;
  return w * (1 + Math.min(set.reps, 12) / 30);
}
function sessionVolume(s, unit) {
  let v = 0;
  for (const en of s.entries) {
    if (en.type !== 'strength') continue;
    for (const set of en.sets) {
      if (set.done && !set.warmup && set.reps) v += weightInUnit(set, unit) * set.reps;
    }
  }
  return v;
}

function bucketKey(dateKey, gran) {
  if (gran === 'day') return dateKey;
  if (gran === 'week') return mondayKeyOf(dateKey);
  return monthKeyOf(dateKey);
}
function bucketLabel(key, gran) {
  if (gran === 'month') {
    const [y, m] = key.split('-').map(Number);
    return MONTHS[m - 1] + " '" + String(y).slice(2);
  }
  const [, m, d] = key.split('-').map(Number);
  return m + '/' + d;
}
// Returns last `count` buckets ending at today: [{key, label, sessions:[]}]
function rollupBuckets(gran, count) {
  const buckets = [];
  const today = new Date();
  if (gran === 'day') {
    for (let i = count - 1; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      buckets.push(dateKeyOf(d.getTime()));
    }
  } else if (gran === 'week') {
    const mon = mondayKeyOf(dateKeyOf(today.getTime()));
    const [y, m, d] = mon.split('-').map(Number);
    for (let i = count - 1; i >= 0; i--) {
      const dt = new Date(y, m - 1, d - i * 7);
      buckets.push(dateKeyOf(dt.getTime()));
    }
  } else {
    for (let i = count - 1; i >= 0; i--) {
      const dt = new Date(today.getFullYear(), today.getMonth() - i, 1);
      buckets.push(dt.getFullYear() + '-' + pad2(dt.getMonth() + 1));
    }
  }
  const map = new Map(buckets.map(k => [k, []]));
  for (const s of DB.sessions) {
    const k = bucketKey(s.dateKey, gran);
    if (map.has(k)) map.get(k).push(s);
  }
  return buckets.map(k => ({ key: k, label: bucketLabel(k, gran), sessions: map.get(k) }));
}

// Per-exercise series over buckets: {top, e1rm, volume} per bucket (null when no data)
function exerciseSeries(exerciseId, gran, count) {
  const unit = DB.settings.unit;
  return rollupBuckets(gran, count).map(b => {
    let top = null, best1rm = null, vol = 0, any = false;
    for (const s of b.sessions) {
      for (const en of s.entries) {
        if (en.exerciseId !== exerciseId || en.type !== 'strength') continue;
        for (const set of en.sets) {
          if (!set.done || set.warmup) continue;
          any = true;
          const w = roundDisplay(weightInUnit(set, unit), unit);
          if (top == null || w > top) top = w;
          const rm = e1rm(set, unit);
          if (best1rm == null || rm > best1rm) best1rm = rm;
          if (set.reps) vol += weightInUnit(set, unit) * set.reps;
        }
      }
    }
    return { label: b.label, top, e1rm: best1rm, volume: any ? vol : null };
  });
}

/* ===================== 6. REST TIMER + SOUND ===================== */

let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* no audio */ }
}
function beep() {
  if (!DB.settings.soundOn || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [[880, 0], [1174, .22]].forEach(([f, dt]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.2);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.25);
    });
  } catch (e) { /* ignore */ }
}
function buzz() {
  if (DB.settings.vibrateOn && navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

let timerInterval = null;
function timerRunning() {
  const t = DB.active && DB.active.timer;
  return !!(t && (t.endsAt || t.startedAt));
}
// Called when a set is checked off. Behavior depends on settings.timerMode:
// 'countdown' counts down `seconds` and alerts; 'stopwatch' counts up from now; 'off' does nothing.
function startTimer(seconds) {
  if (!DB.active) return;
  const mode = DB.settings.timerMode || 'countdown';
  if (mode === 'off') return;
  if (mode === 'stopwatch') {
    DB.active.timer = { endsAt: null, startedAt: Date.now() };
  } else {
    DB.active.timer = { endsAt: Date.now() + seconds * 1000, startedAt: null };
    UI.timerTotal = seconds;
  }
  saveActive();
  runTimerLoop();
  renderTimerBar();
}
function addTimer(seconds) {
  if (!DB.active || !DB.active.timer || !DB.active.timer.endsAt) return;
  DB.active.timer.endsAt += seconds * 1000;
  UI.timerTotal += seconds;
  saveActive();
  renderTimerBar();
}
function stopTimer() {
  if (DB.active && DB.active.timer) { DB.active.timer.endsAt = null; DB.active.timer.startedAt = null; saveActive(); }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  renderTimerBar();
}
function runTimerLoop() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const t = DB.active && DB.active.timer;
    if (!t || (!t.endsAt && !t.startedAt)) { stopTimer(); return; }
    const eEl = document.getElementById('elapsed');
    if (eEl && DB.active) eEl.textContent = fmtDur((Date.now() - DB.active.startedAt) / 1000);
    const el = document.getElementById('timer-remaining');
    if (t.endsAt) {
      const remain = Math.round((t.endsAt - Date.now()) / 1000);
      if (remain <= 0) {
        stopTimer();
        beep(); buzz();
        const fl = document.getElementById('flash');
        fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
        setTimeout(() => fl.classList.remove('on'), 1600);
        toast('Rest over — next set!');
      } else if (el) el.textContent = fmtDur(remain);
    } else if (el) {
      el.textContent = fmtDur((Date.now() - t.startedAt) / 1000);
    }
  }, 500);
}
function renderTimerBar() {
  const bar = document.getElementById('timerbar');
  const t = DB.active && DB.active.timer;
  const onWorkoutScreen = UI.view === 'workout' || UI.view === 'workoutExercise';
  if (!t || (!t.endsAt && !t.startedAt) || !onWorkoutScreen) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  if (t.endsAt) {
    const remain = Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
    bar.innerHTML =
      '<span style="flex:1">Rest <span id="timer-remaining">' + fmtDur(remain) + '</span></span>' +
      '<button data-action="timer-plus30">+30s</button>' +
      '<button data-action="timer-skip">Skip</button>';
  } else {
    const elapsed = Math.max(0, Math.round((Date.now() - t.startedAt) / 1000));
    bar.innerHTML =
      '<span style="flex:1">Rest <span id="timer-remaining">' + fmtDur(elapsed) + '</span></span>' +
      '<button data-action="timer-skip">Hide</button>';
  }
}

// elapsed-time ticker for the workout header even when no rest timer runs
setInterval(() => {
  if (DB.active && !timerRunning()) {
    const eEl = document.getElementById('elapsed');
    if (eEl) eEl.textContent = fmtDur((Date.now() - DB.active.startedAt) / 1000);
  }
}, 1000);

/* ===================== 7. CHARTS (inline SVG) ===================== */

function niceTicks(max) {
  if (max <= 0) return [0, 1];
  const raw = max / 3;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const ticks = [];
  for (let v = 0; v <= max * 1.001; v += step) ticks.push(Math.round(v * 100) / 100);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}

// points: [{label, value|null}]; kind: 'line' | 'bar'
function svgChart(points, kind, unitLabel) {
  const W = 340, H = 170, padL = 38, padR = 8, padT = 10, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vals = points.map(p => p.value).filter(v => v != null);
  if (!vals.length) return '<div class="muted small" style="padding:20px;text-align:center">No data yet</div>';
  const ticks = niceTicks(Math.max(...vals));
  const maxV = ticks[ticks.length - 1] || 1;
  const x = i => padL + (points.length === 1 ? iw / 2 : (i * iw / (points.length - 1)));
  const bx = i => padL + i * (iw / points.length);
  const bw = Math.max(4, iw / points.length - 4);
  const y = v => padT + ih - (v / maxV) * ih;
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  // gridlines + y labels
  for (const t of ticks) {
    out += '<line x1="' + padL + '" y1="' + y(t) + '" x2="' + (W - padR) + '" y2="' + y(t) + '" stroke="var(--border)" stroke-width="1"/>';
    out += '<text x="' + (padL - 5) + '" y="' + (y(t) + 3.5) + '" text-anchor="end" font-size="9" fill="var(--text2)">' + fmtNum(t) + '</text>';
  }
  // x labels (thin out to ~6)
  const stepLbl = Math.ceil(points.length / 6);
  points.forEach((p, i) => {
    if (i % stepLbl === 0 || i === points.length - 1) {
      const cx = kind === 'bar' ? bx(i) + bw / 2 : x(i);
      out += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="var(--text2)">' + esc(p.label) + '</text>';
    }
  });
  if (kind === 'bar') {
    points.forEach((p, i) => {
      const v = p.value == null ? 0 : p.value;
      out += '<rect x="' + bx(i) + '" y="' + y(v) + '" width="' + bw + '" height="' + Math.max(0, padT + ih - y(v)) +
        '" rx="2" fill="var(--accent)"><title>' + esc(p.label) + ': ' + fmtNum(v) + (unitLabel ? ' ' + unitLabel : '') + '</title></rect>';
    });
  } else {
    let path = '', started = false;
    points.forEach((p, i) => {
      if (p.value == null) { started = false; return; }
      path += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1) + ' ';
      started = true;
    });
    out += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    points.forEach((p, i) => {
      if (p.value == null) return;
      out += '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="3.5" fill="var(--accent)"><title>' +
        esc(p.label) + ': ' + fmtNum(p.value) + (unitLabel ? ' ' + unitLabel : '') + '</title></circle>';
    });
  }
  return out + '</svg>';
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

let sheetOnClose = null;
function openSheet(html, onClose) {
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetwrap').classList.add('open');
  sheetOnClose = onClose || null;
}
function closeSheet() {
  document.getElementById('sheetwrap').classList.remove('open');
  document.getElementById('sheet').innerHTML = '';
  if (sheetOnClose) { const f = sheetOnClose; sheetOnClose = null; f(); }
}

let confirmYes = null;
function uiConfirm(message, onYes, yesLabel) {

    '<h3>Are you sure?</h3><p style="margin-bottom:16px">' + esc(message) + '</p>' +
    '<div class="row"><button class="btn secondary" style="flex:1" data-action="sheet-close">Cancel</button>' +

  if (!DB.sessions.length) return false;

function viewHome() {
  let h = '<div class="home-top"><span class="lbl ink brand">Iron Log</span><span class="lbl">' + todayLabel() + '</span></div>';

    h += '<div class="banner">This browser is blocking storage — data will NOT be saved on this device.</div>';
  }

    h += '<div class="inprog" data-action="resume-active">' +

// The slot between two exercise rows: the superset chain toggle (open arches off, bold closed link on).
// Rendered empty after the last row so every .ex-item has the same height for drag-reorder.
function ssSlot(show, active, action, idx) {
  return '<div class="ss-slot">' + (show
    ? '<button class="ss-toggle' + (active ? ' active' : '') + '" data-action="' + action + '" data-idx="' + idx +
      '" aria-label="Superset with next exercise" aria-pressed="' + active + '">' + (active ? LINK_ON_ICON : LINK_OFF_ICON) + '</button>'

// One tappable row per exercise on the workout list screen — set count only (Dropset-style);
// weights and the last-session summary live on the exercise screen.
function workoutEntryRow(en) {
  const done = en.sets.filter(x => x.done);
  const complete = en.sets.length > 0 && done.length === en.sets.length;
  const n = en.sets.length;
  const status = (done.length ? done.length + '/' : '') + n + ' set' + (n === 1 ? '' : 's');
  return '<div class="card tappable row" style="padding:14px 16px" data-action="open-workout-exercise" data-entry="' + en.id + '">' +
    '<div class="checkdot' + (complete ? ' complete' : '') + '">' + (complete ? CHECK_ICON : '') + '</div>' +
    '<div class="grow"><b>' + esc(en.exerciseName) + '</b>' +
    '<div class="lbl" style="margin-top:5px">' + esc(status) + '</div></div>' +
    '<span class="chev">' + CHEV_ICON + '</span></div>';
}

// "Updated Aug 12" under the note — blank when there's no note or it predates noteAt tracking.
function noteMeta(en) {
  return en.note && en.noteAt ? 'Note updated ' + fmtDateKey(dateKeyOf(en.noteAt)) : '';
}

// Detail screen: all sets + per-exercise note for one entry (Dropset-style drill-in)
function inSupersetChain(en) {
  const ens = DB.active ? DB.active.entries : [];
  const i = ens.indexOf(en);
  if (i < 0) return false;
  return (!!en.ss && i < ens.length - 1) || (i > 0 && !!ens[i - 1].ss);
}

function viewWorkoutExercise() {
  const s = DB.active;
  const en = s && s.entries.find(x => x.id === UI.params.entryId);
  if (!en) return '<div class="empty-state">Exercise not found.</div>';
  const last = lastParts(en.exerciseId);
  let h = '<div class="xs-top">' + backBtn() + '<div class="right">' +

  h += '<button class="btn danger full" style="margin-top:20px" data-action="del-entry" data-entry="' + en.id + '">Remove from this workout</button>';

// Last finished session for this exercise, for the "LAST SESSION · AUG 28 — 185×8 · 185×8" row.
function lastParts(exerciseId) {
  const last = lastByExercise().get(exerciseId);
  if (!last) return null;
  const u = DB.settings.unit;
  const parts = last.entry.sets.filter(x => x.done && !x.warmup).map(x =>
    fmtNum(roundDisplay(weightInUnit(x, u), u)) + '×' + (x.reps || 0));
  if (!parts.length) return null;
  return { date: fmtDateKey(last.session.dateKey), sets: parts.join(' · ') };
}

// Reps cell: a button showing the value; tapping opens the rep editor sheet (openRepEditor).
// attrs carries the data-* the rep-edit action needs to find its target.
// value + small unit label, centred together; empty state shows just the unit
function repInner(n) {
  return n == null || n === 0 ? '<span class="unit">reps</span>' : '<span class="v">' + n + '</span><span class="unit">reps</span>';
}
function repBtn(reps, attrs, cls) {
  const n = reps == null ? null : Math.max(0, Math.round(reps));
  return '<button class="' + (cls || 'num') + ' repbtn' + (n == null ? ' empty' : '') + '" data-action="rep-edit" ' + attrs + '>' +
    repInner(n) + '</button>';
}

// Exercise-screen set rows: [check / warm-up glyph] [weight] [reps] … [···]. The weight input is
// sized to its digits (ch units) so value + unit centre as one group; the ··· menu holds warm-up and delete.
function setsGrid(en) {
  const u = DB.settings.unit;
  let h = '<div class="xs-sets">';
  en.sets.forEach(set => {
    const ids = 'data-entry="' + en.id + '" data-set="' + set.id + '"';

      (set.done ? CHECK_ICON : (set.warmup ? SUNRISE_ICON : '')) + '</button>' +
      '<span class="xs-pill xs-w' + (w ? '' : ' empty') + '"><input class="num" type="text" inputmode="decimal" value="' + esc(w) + '" ' +
      'style="width:' + Math.max(1, w.length) + 'ch" data-input="set-weight" ' + ids + ' aria-label="Weight">' +

function historyProgress() {
  const unit = DB.settings.unit;
  const gran = UI.progressGran;

  DB.sessions.forEach(s => s.entries.forEach(en => { if (en.type === 'strength') inHistory.add(en.exerciseId); }));

      svgChart(series.map(p => ({ label: p.label, value: p.volume })), 'bar', unit) + '</div>';

    const last30 = DB.sessions.filter(s => s.startedAt >= d30);
    const sets30 = last30.reduce((a, s) => a + s.entries.reduce((x, en) => x + en.sets.filter(t => t.done && !t.warmup).length, 0), 0);

    h += '<div class="chartbox"><div class="chart-title">Total volume (' + unit + ')</div>' + svgChart(volume, 'bar', unit) + '</div>';
    h += '<div class="chartbox"><div class="chart-title">Workouts</div>' + svgChart(counts, 'bar', '') + '</div>';
  }
  return h;

const VIEWS = {
  home: viewHome, workout: viewWorkout, workoutExercise: viewWorkoutExercise,
  history: viewHistory, session: viewSession,
  library: viewLibrary, routineEdit: viewRoutineEdit, templateEdit: viewTemplateEdit,
  templateExercise: viewTemplateExercise,

function navigate(view, params) {
  if (['home', 'history', 'library', 'settings'].includes(view)) {
    UI.backStack = [];
  } else {
    UI.backStack.push({ view: UI.view, params: UI.params });
  }
  UI.view = view;
  UI.params = params || {};
  render();
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
}
function back() {
  const prev = UI.backStack.pop();
  if (prev) { UI.view = prev.view; UI.params = prev.params; }
  else { UI.view = 'home'; UI.params = {}; }
  render();
  window.scrollTo(0, 0);
}
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function render() {
  const fn = VIEWS[UI.view] || viewHome;
  document.getElementById('main').innerHTML = fn();
  document.querySelectorAll('textarea[data-autosize]').forEach(autosize);
  renderTabBar();
  renderTimerBar();
}

// Horizontal slide between screens: a fixed-position snapshot of the old screen slides out
// while the freshly rendered #main slides in. dir 'forward' = out left / in from right
// (superset advance); dir 'back' = out right / in from left (swipe-back).
function slideTransition(renderFn, dir) {
  const main = document.getElementById('main');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    renderFn(); window.scrollTo(0, 0); return;
  }
  document.querySelectorAll('.slide-ghost').forEach(g => g.remove());
  const ghost = document.createElement('div');
  ghost.className = 'slide-ghost' + (dir === 'back' ? ' back' : '');
  const snap = main.cloneNode(true);
  snap.removeAttribute('id');
  snap.style.cssText = 'padding:16px;max-width:640px;margin:0 auto;transform:translateY(-' + window.scrollY + 'px)';
  ghost.appendChild(snap);
  document.body.appendChild(ghost);
  renderFn();
  window.scrollTo(0, 0);
  const inClass = dir === 'back' ? 'slide-in-back' : 'slide-in';
  main.classList.remove('slide-in', 'slide-in-back');
  void main.offsetWidth; // restart the animation
  main.classList.add(inClass);
  ghost.addEventListener('animationend', () => ghost.remove());
  setTimeout(() => { ghost.remove(); main.classList.remove(inClass); }, 450);
}
function slideSwap() { slideTransition(render, 'forward'); }
function backWithSlide() { slideTransition(back, 'back'); }

// Swipe right anywhere on a pushed screen to go back (thumb-friendly alternative to the ‹ button)
const ROOT_VIEWS = ['home', 'history', 'library', 'settings'];
let swipeStart = null;
document.addEventListener('touchstart', e => {
  swipeStart = null;
  if (ROOT_VIEWS.includes(UI.view)) return;
  if (document.getElementById('sheetwrap').classList.contains('open')) return;
  if (e.target.closest('input, textarea, select')) return;
  swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!swipeStart) return;
  const dx = e.touches[0].clientX - swipeStart.x;
  const dy = e.touches[0].clientY - swipeStart.y;
  if (rd && rd.active) { swipeStart = null; return; } // a row is being dragged
  if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) swipeStart = null; // it's a vertical scroll
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  const dt = Date.now() - swipeStart.t;
  swipeStart = null;
  if (dx > 70 && Math.abs(dy) < dx * 0.6 && dt < 600) backWithSlide();
}, { passive: true });
document.addEventListener('touchcancel', () => { swipeStart = null; }, { passive: true });

// Rep editor sheet (Dropset-style): big number you can drag up/down (one rep per RE_STEP px),
// − / + steppers, and an in-app keypad so the system keyboard never opens. The first digit typed
// replaces the current value; ⌫ and the steppers edit it in place. onChange(v|null) writes state
// (set-reps / plan-reps), and the row re-renders when the sheet closes.
const RE_STEP = 96; // px of drag per rep — 28 and 48 both felt too quick to Justin
let re = null; // { val, fresh, onChange, btn }
function repEditorHTML(meta) {
  return '<div class="re-head"><span class="lbl ink">' + esc(meta.title) + '</span><span class="lbl">' + esc(meta.sub) + '</span></div>' +
    '<div class="re-top">' +
    '<button class="re-step" data-action="re-dec" aria-label="Fewer reps">−</button>' +
    '<div class="re-drum" id="re-drum"><div class="re-col" id="re-col">' +
    '<div class="re-ghost" id="re-prev"></div><div class="re-val" id="re-val"></div><div class="re-ghost" id="re-next"></div>' +
    '</div></div>' +
    '<button class="re-step" data-action="re-inc" aria-label="More reps">+</button></div>' +
    '<div class="re-pad">' +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => '<button data-action="re-key" data-key="' + d + '">' + d + '</button>').join('') +
    '<button class="blank" tabindex="-1"></button>' +
    '<button data-action="re-key" data-key="0">0</button>' +
    '<button data-action="re-key" data-key="del" aria-label="Delete">⌫</button></div>' +
    '<button class="btn primary full" style="height:50px" data-action="sheet-close">Done</button>';
}
function openRepEditor(initial, onChange, btn, meta) {
  re = { val: initial == null ? 0 : Math.max(0, Math.round(initial)), fresh: true, onChange, btn };
  openSheet(repEditorHTML(meta || { title: 'Reps', sub: '' }), () => { re = null; render(); });
  reDraw();
}
function reDraw() {
  if (!re) return;
  const v = re.val;
  document.getElementById('re-prev').textContent = v > 0 ? v - 1 : '';
  document.getElementById('re-val').textContent = v;
  document.getElementById('re-next').textContent = v + 1;
}
function reSet(v, fromKeypad) {
  if (!re) return;
  re.val = Math.min(999, Math.max(0, v));
  if (!fromKeypad) re.fresh = false;
  reDraw();
  re.onChange(re.val === 0 ? null : re.val);

let reDrag = null;

// Hold-to-drag reordering for [data-reorder] lists (.ex-item rows). Press a row for HOLD_MS (or
// grab the .grip immediately) to lift it; other rows slide aside via transforms; releasing
// commits through reorderItems(). Moving before the hold completes cancels (that's a scroll).
// A non-passive touchmove listener blocks page scroll only while a drag is live.
const HOLD_MS = 350;

  const onGrip = !!e.target.closest('.grip');
  if (!onGrip && e.target.closest('button, input, textarea, select, .ss-slot')) return;
  rdCancel();

function rdStart() {

  rd.h = rd.rects[rd.idx].height;
  rd.target = rd.idx;
  rd.list.classList.add('reordering');
  rd.item.classList.add('drag');
  try { rd.item.setPointerCapture(rd.id); } catch (_) {}

function rdCancel() {

function rdCleanup(d) {

document.addEventListener('pointermove', e => {

    return;
  }

  rd.item.style.transform = 'translateY(' + dy + 'px)';
  const cy = rd.rects[rd.idx].top + rd.h / 2 + dy;
  let t = rd.idx;
  rd.rects.forEach((r, i) => {
    const mid = r.top + r.height / 2;
    if (i < rd.idx && cy < mid) t = Math.min(t, i);
    if (i > rd.idx && cy > mid) t = Math.max(t, i);

  rd.items.forEach((el, i) => {

function confirmStart(r, t) {

function findSet(entryId, setId) {
  if (!DB.active) return {};
  const entry = DB.active.entries.find(e => e.id === entryId);
  const set = entry && entry.sets.find(s => s.id === setId);
  return { entry, set };
}
function restSecFor(entry) {
  const ex = exerciseById(entry.exerciseId);
  return (ex && ex.restSec != null) ? ex.restSec : DB.settings.defaultRestSec;
}

// Superset chains are maximal runs of consecutive entries where entry.ss links to the next.
// Returns the next entry in this entry's chain that still has unfinished sets (cycling), or null.
function nextInSuperset(entry) {
  const ens = DB.active.entries;
  const i = ens.indexOf(entry);
  if (i < 0) return null;
  let start = i, end = i;
  while (start > 0 && ens[start - 1].ss) start--;
  while (end < ens.length - 1 && ens[end].ss) end++;
  if (start === end) return null;
  const len = end - start + 1;
  for (let k = 1; k < len; k++) {
    const cand = ens[start + ((i - start + k) % len)];
    if (cand.sets.some(x => !x.done)) return cand;
  }
  return null;
}

function reorderItems(kind, from, to) {
  let arr, save;
  if (kind === 'live') {
    if (!DB.active) return;
    arr = DB.active.entries; save = saveActive;
  } else {
    const { r, t } = templateById(UI.params.routineId, UI.params.templateId);
    if (!t) return;
    arr = t.items; save = () => { r.updatedAt = Date.now(); saveRoutines(); };
  }
  if (from === to || from < 0 || to < 0 || from >= arr.length || to >= arr.length) return;
  const [it] = arr.splice(from, 1);
  arr.splice(to, 0, it);
  save(); render();

  const it = t && t.items[i];
  if (!it) return;
  it.targetSets = Math.min(10, Math.max(1, (it.plan ? it.plan.length : it.targetSets) + d));
  if (it.plan) { // keep the plan in lockstep with the stepper
    while (it.plan.length < it.targetSets) {
      const last = it.plan[it.plan.length - 1];
      it.plan.push({ weight: last ? last.weight : null, unit: last ? last.unit : DB.settings.unit, reps: last ? last.reps : null, warmup: false });
    }
    while (it.plan.length > it.targetSets) it.plan.pop();
  }
  r.updatedAt = Date.now(); saveRoutines(); render();
}

document.body.addEventListener('click', e => {
  ensureAudio();
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el);
});

const inputs = {
  'set-weight': (el) => {
    const { set } = findSet(el.dataset.entry, el.dataset.set);
    if (set) { set.weight = parseNum(el.value); set.unit = DB.settings.unit; saveActive(); }
    el.style.width = Math.max(1, el.value.length) + 'ch';
    if (el.parentElement) el.parentElement.classList.toggle('empty', !el.value);
  },
  'set-reps': (el) => {
    const { set } = findSet(el.dataset.entry, el.dataset.set);
    if (set) { const v = parseNum(el.value); set.reps = v == null ? null : Math.round(v); saveActive(); }
  },
  'workout-note': (el) => { if (DB.active) { DB.active.notes = el.value; saveActive(); } },
  'entry-note': (el) => {
    const en = DB.active && DB.active.entries.find(x => x.id === el.dataset.entry);
    if (!en) return;
    en.note = el.value; en.noteAt = el.value ? Date.now() : null; saveActive();
    if (el.dataset.autosize != null) autosize(el);
    const meta = document.getElementById('note-meta');
    if (meta) meta.textContent = noteMeta(en);
  },
  'routine-name': (el) => {
    const r = routineById(el.dataset.id);
    if (r) { r.name = el.value; r.updatedAt = Date.now(); saveRoutines(); }
  },
  'template-name': (el) => {
    const { r, t } = templateById(UI.params.routineId, UI.params.templateId);
    if (t) { t.name = el.value; r.updatedAt = Date.now(); saveRoutines(); }
  },
  'ex-name': (el) => { const x = exerciseById(el.dataset.id); if (x) { x.name = el.value; saveExercises(); } },
  'ex-rest': (el) => {
    const x = exerciseById(el.dataset.id);
    if (x) { const v = parseNum(el.value); x.restSec = v == null ? null : Math.round(v); saveExercises(); }
  },
  'ex-notes': (el) => { const x = exerciseById(el.dataset.id); if (x) { x.notes = el.value; saveExercises(); } },
  'ex-search': (el) => {
    UI.exSearch = el.value;
    const list = document.getElementById('ex-list');
    if (list) list.innerHTML = exListHTML();
  },
  'picker-search': (el) => {
    UI.pickerSearch = el.value;
    const res = document.getElementById('picker-results');
    const slot = document.getElementById('picker-create-slot');
    if (res) res.innerHTML = pickerResultsHTML();
    if (slot) slot.innerHTML = pickerCreateHTML();
  },
  'plan-weight': (el) => {
    const it = curTplItem();
    const p = it && it.plan && it.plan[+el.dataset.row];
    if (p) { p.weight = parseNum(el.value); p.unit = DB.settings.unit; saveRoutines(); }
  },
  'plan-reps': (el) => {
    const it = curTplItem();
    const p = it && it.plan && it.plan[+el.dataset.row];
    if (p) { const v = parseNum(el.value); p.reps = v == null ? null : Math.round(v); saveRoutines(); }
  },
  'default-rest': (el) => {
    const v = parseNum(el.value);
    if (v != null && v > 0) { DB.settings.defaultRestSec = Math.round(v); saveSettings(); }
  }
};
document.body.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  const fn = inputs[el.dataset.input];
  if (fn) fn(el);
});

document.body.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'progress-exercise') { UI.progressExercise = el.value || null; render(); }
  if (kind === 'sound-on') { DB.settings.soundOn = el.checked; saveSettings(); }
  if (kind === 'vibrate-on') { DB.settings.vibrateOn = el.checked; saveSettings(); }
});

/* ===================== 12. EXPORT / IMPORT ===================== */

function buildExport() {
  return JSON.stringify({
    app: 'workout-tracker',
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    settings: DB.settings,
    exercises: DB.exercises,
    routines: DB.routines,
    sessions: DB.sessions
  });
}

function runImport() {
  const box = document.getElementById('import-box');
  let data;
  try { data = JSON.parse(box.value); }
  catch (e) { toast('That isn\'t valid JSON — paste the whole backup.'); return; }
  if (!data || data.app !== 'workout-tracker' || !Array.isArray(data.exercises) ||
      !Array.isArray(data.routines) || !Array.isArray(data.sessions)) {
    toast('This doesn\'t look like an Iron Log backup.'); return;
  }
  if ((data.schemaVersion || 1) > SCHEMA_VERSION) {
    toast('This backup is from a newer version of the app.'); return;
  }
  uiConfirm(
    'Import ' + data.exercises.length + ' exercises, ' + data.routines.length + ' routines and ' +
    data.sessions.length + ' workouts — replacing everything on this device?',
    () => {
      DB.settings = Object.assign({ unit: 'lbs', defaultRestSec: 90, timerMode: 'countdown', soundOn: true, vibrateOn: true, lastExportAt: null }, data.settings);
      DB.exercises = data.exercises;
      DB.routines = migrateRoutinesV2(data.routines);
      DB.sessions = data.sessions;
      DB.sessions.sort((a, b) => a.startedAt - b.startedAt);
      DB.meta = DB.meta || { createdAt: Date.now() };
      DB.meta.schemaVersion = SCHEMA_VERSION;
      saveMeta(); saveSettings(); saveExercises(); saveRoutines(); saveSessions();
      invalidateLastMap();
      UI.importOpen = false;
      render();
      toast('Backup imported ✓');
    }, 'Import');
}

/* ===================== 13. INIT ===================== */

const CAP = { downloads: null };

(async function init() {
  loadAll();
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
  // artifact runtime capability (absent when running locally / outside claude.ai)
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(dl => {
      CAP.downloads = dl || null;
      if (dl && UI.view === 'settings') render();
    }).catch(() => {});
  }
  render();
  const t = DB.active && DB.active.timer;
  if (t && ((t.endsAt && t.endsAt > Date.now()) || t.startedAt)) {
    if (t.endsAt) UI.timerTotal = Math.round((t.endsAt - Date.now()) / 1000);
    runTimerLoop();
  }
})();
</script>
